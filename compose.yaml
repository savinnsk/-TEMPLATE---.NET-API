services:
    postgres:
      image: postgres:17
      command:
        - postgres
        - -c
        - max_connections=200
        - -c
        - idle_in_transaction_session_timeout=60000
        - -c
        - log_connections=on
        - -c
        - log_disconnections=on
      environment:
        POSTGRES_USER: savinnsk
        POSTGRES_PASSWORD: password123
        POSTGRES_DB: is-agents
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data:
